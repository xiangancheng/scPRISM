name: scprism
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # 科学计算与空间转录组基础依赖
  - numpy>=1.22.0,<2.0.0
  - scipy>=1.9.0
  - pandas>=1.5.0
  - scikit-learn>=1.0.0
  - matplotlib>=3.5.0
  - seaborn>=0.12.0
  - tqdm>=4.65.0
  - libpysal
  - pip:
      # RTX 5060 (Blackwell 架构, sm_120) 需使用 CUDA 12.8 编译版本的 PyTorch 2.6+
      - torch>=2.6.0 --index-url https://download.pytorch.org/whl/cu128
      - torchaudio --index-url https://download.pytorch.org/whl/cu128
      # 单细胞与空间组学核心依赖
      - scanpy>=1.9.0
      - anndata>=0.8.0
      - squidpy>=1.2.0
      # 可编辑模式安装当前 scPRISM 包
      - -e .
